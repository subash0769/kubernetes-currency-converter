apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: converter-ingress
  namespace: converter
  labels:
    app.kubernetes.io/name: myingress
spec:
  ingressClassName: nginx
  rules:
  - host: subash.local
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: converter-service
            port: 
              number: 5000
